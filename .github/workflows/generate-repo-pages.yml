name: Generate repo pages & sitemap

on:
  schedule:
    - cron: '17 2 * * *'   # daily at 02:17 UTC — refreshes lastmod as repos change
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_repo_pages.py'
      - '.github/workflows/generate-repo-pages.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate static repo pages + sitemap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: saveetha-labs
          BASE_URL: https://saveetha-labs.github.io
        run: python scripts/generate_repo_pages.py

      - name: Commit & push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/*.html repo/_repos.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate repo pages & sitemap [skip ci]"
            git push
          fi
