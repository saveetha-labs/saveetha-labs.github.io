<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Saveetha Labs</title>

  <meta name="robots" content="noindex" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #020617;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .box {
      max-width: 520px;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      margin-bottom: 10px;
    }

    p {
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: #38bdf8;
      color: #020617;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
    }

    a:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>404</h1>
    <p>
      Oops! The page you’re looking for doesn’t exist.<br />
      It may have been moved, renamed, or never existed.
    </p>

    <a href="/">← Back to Saveetha Labs</a>
  </div>

</body>
</html>
